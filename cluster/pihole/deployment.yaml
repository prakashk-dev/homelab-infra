apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  selector: { matchLabels: { app: pihole } }
  template:
    metadata: { labels: { app: pihole } }
    spec:
      containers:
        - name: pihole
          image: pihole/pihole:latest
          resources: { limits: { memory: "256Mi", cpu: "500m" } }
          env:
            - { name: TZ, value: "Australia/Melbourne" }
            - { name: FTLCONF_webserver_api_password, value: "changeme" }
          ports:
            - { containerPort: 53, protocol: TCP }
            - { containerPort: 53, protocol: UDP }
            - { containerPort: 80, protocol: TCP }
          volumeMounts:
            - { name: config, mountPath: /etc/pihole }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: pihole-config }
