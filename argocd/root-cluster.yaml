apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/prakashk-dev/homelab-infra.git
    targetRevision: main
    path: cluster
    directory: { recurse: true }
  destination: { server: https://kubernetes.default.svc }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
